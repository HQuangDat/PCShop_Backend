services:
  redis:
    image: redis:7.4-alpine
    container_name: pcshop-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --loglevel notice
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - redis_network

  redisinsight:
    image: redis/redisinsight:latest
    container_name: pcshop-redisinsight
    restart: unless-stopped
    ports:
      - "127.0.0.1:5540:5540"
    volumes:
      - redisinsight_data:/data
    networks:
      - redis_network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_data:
    driver: local
  redisinsight_data:
    driver: local

networks:
  redis_network:
    driver: bridge
